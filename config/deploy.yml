service: job-tracker
image: educhaos/job-tracker

# servers:
#   - <%= ENV['DEPLOY_HOST_ADDRESS'] %>
servers:
  web:
    hosts:
      - 137.131.206.147
    options:
      network-alias: job-tracker
      
proxy:
  ssl: true
  host: jobtracker.bruno.api.br
  app_port: 4000
  healthcheck:
    path: /health

registry:
  server: docker.io
  username: educhaos
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  clear:
    DATA_DIR: /data
    PHX_HOST: jobtracker.bruno.api.br
    RELEASE_NODE: track_my_job_ex
    RELEASE_DISTRIBUTION: name
    RELEASE_NODE: track_my_job_ex@127.0.0.1
  secret:
    # ❯ mix phx.gen.secret 64
    - SECRET_KEY_BASE
    - RELEASE_COOKIE

volumes:
  - /data/job-tracker:/data

builder:
  # it should match Oracle / OCI architecture (Ubuntu 24.04.4 LTS - GNU/Linux 6.17.0-1011-oracle aarch64)
  arch: arm64

# Use a different ssh user than root.
ssh:
  user: ubuntu
